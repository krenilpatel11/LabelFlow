<div #testimonial class="pt-14 lg:pt-[120px]">
  <h2 #headline class="text-5xl sm:text-7xl lg:text-9xl tracking-tight font-medium mb-6 lg:mb-14 lg:w-1/2">
    Accomplishments until now
  </h2>
  <p class="text-3xl lg:text-4xl font-semibold lg:w-2/3">
    Our top concern is the customer. These are our clients' responses following
    our outstanding job.
  </p>
  <div class="grid grid-cols-3 pt-4 lg:gap-20 lg:ml-[35%]">
    <div
      class="lg:justify-self-end xl:block animate-left-right transition-all duration-1000 animate"
    >
      <!-- Inline arrow SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
    <div
      class="text-4xl md:text-6xl lg:text-8xl text-primary font-semibold animate-top-bottom transition-all duration-1000 delay-500 animate text-brand-default"
    >
      <div class="mb-2">
        <span class="setcount" data-target="100" style="opacity: 1">0</span>+
      </div>
      <div class="text-base sm:text-normal md:text-lg lg:text-xl text-grey">
        Project Done
      </div>
    </div>
    <div
      class="text-4xl md:text-6xl lg:text-8xl text-primary font-semibold animate-left-right transition-all duration-1000 delay-700 animate text-brand-default"
    >
      <div class="mb-2">
        <span class="setcount" data-target="30" style="opacity: 1">0</span>+
      </div>
      <div class="text-base sm:text-normal md:text-lg lg:text-xl text-grey">
        Happy Clients
      </div>
    </div>
  </div>
</div>
